<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebXR Photo Gallery - Simplified Controls</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    body { 
      margin: 0; 
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1;
    }
    #start-button {
      padding: 12px 24px;
      font-size: 18px;
      background: rgba(72, 118, 255, 0.8);
      color: white;
      border: none;
      border-radius: 30px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #start-button:hover {
      background: rgba(72, 118, 255, 1);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }
    #status {
      margin-top: 15px;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 10px 15px;
      border-radius: 12px;
      display: none;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div id="overlay">
    <button id="start-button">Start Photo Gallery</button>
    <div id="status"></div>
  </div>
  
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.150.1/build/three.module.js';
    import { ARButton } from 'https://unpkg.com/three@0.150.1/examples/jsm/webxr/ARButton.js';
    
    // Error handling for WebXR
    window.addEventListener('error', function(event) {
      console.error('Global error:', event.error);
      updateStatus('An error occurred. Please restart the application.');
    });
    
    // Main variables
    let camera, scene, renderer;
    let controllers = [];
    let selectedPhoto = null;
    let interactionMode = 'none'; // 'none', 'move', 'transform' (combined resize/rotate)
    let photos = [];
    let photoFrames = [];
    
    // Interaction state tracking
    let activeControllers = new Set();
    let initialControllerPositions = {};
    let initialDistance = 0;
    let initialRotation = 0;
    let initialScale = new THREE.Vector3();
    
    // Set up the photo gallery paths
    const photoURLs = [
      './Photo/photo1.jpg',
      './Photo/photo2.jpg',
      './Photo/photo3.jpg',
      './Photo/photo4.jpg',
      './Photo/photo5.jpg',
    ];
    
    init();

    function init() {
      // Scene setup
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      // Renderer setup
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.setClearColor(0x000000, 0);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0x404040, 2);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
      directionalLight.position.set(1, 1, 1);
      directionalLight.castShadow = true;
      scene.add(directionalLight);

      // Start button event
      document.getElementById('start-button').addEventListener('click', () => {
        if (navigator.xr) {
          navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
            if (supported) {
              const sessionInit = { 
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['dom-overlay', 'hand-tracking'], 
                domOverlay: { root: document.body } 
              };
              navigator.xr.requestSession('immersive-ar', sessionInit).then(onSessionStarted);
            } else {
              updateStatus('WebXR AR session is not supported on this device.');
            }
          });
        } else {
          updateStatus('WebXR is not supported in this browser.');
        }
      });

      // Handle window resize
      window.addEventListener('resize', onWindowResize);
    }

    function updateStatus(message) {
      const statusElement = document.getElementById('status');
      statusElement.style.display = 'block';
      statusElement.textContent = message;
      
      // Auto-hide status after 3 seconds for non-error messages
      if (!message.includes('error') && !message.includes('not supported')) {
        setTimeout(() => {
          statusElement.style.display = 'none';
        }, 3000);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onSessionStarted(session) {
      // Set up XR session
      renderer.xr.setReferenceSpaceType('local');
      renderer.xr.setSession(session);
      
      // Hide button and show status
      document.getElementById('start-button').style.display = 'none';
      updateStatus('Loading photos...');

      // Create photo gallery
      createPhotoGallery();
      
      // Set up controllers
      setupControllers(session);

      // Start animation loop
      renderer.setAnimationLoop(render);

      // Handle session end
      session.addEventListener('end', onSessionEnd);
    }

    function onSessionEnd() {
      updateStatus('AR session ended');
      document.getElementById('start-button').style.display = 'block';
    }

    function createPhotoGallery() {
      const textureLoader = new THREE.TextureLoader();
      
      // Arrange photos in a semi-circle pattern
      photoURLs.forEach((url, index) => {
        const aspectRatio = 4/3; // Default until image loads
        const width = 0.25;
        const height = width / aspectRatio;
        
        // Create photo frame with placeholder material
        const photoGeometry = new THREE.PlaneGeometry(width, height);
        const placeholderMaterial = new THREE.MeshBasicMaterial({ 
          color: 0xcccccc,
          side: THREE.DoubleSide
        });
        
        const photoFrame = new THREE.Mesh(photoGeometry, placeholderMaterial);
        
        // Create border frame
        const borderWidth = 0.01;
        const borderGeometry = new THREE.PlaneGeometry(width + borderWidth, height + borderWidth);
        const borderMaterial = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          side: THREE.DoubleSide,
          roughness: 0.7,
          metalness: 0.3
        });
        
        const borderFrame = new THREE.Mesh(borderGeometry, borderMaterial);
        borderFrame.position.z = -0.001; // Slightly behind photo
        
        const photoWithFrame = new THREE.Group();
        photoWithFrame.add(photoFrame);
        photoWithFrame.add(borderFrame);
        
        // Position the photos in a semi-circle in front of the user
        const radius = 0.8; // Radius of the circle
        const totalAngle = Math.PI * 0.8; // How much of the circle to use
        const angle = -totalAngle/2 + (index / (photoURLs.length-1)) * totalAngle;
        
        const x = radius * Math.sin(angle);
        const z = -radius * Math.cos(angle);
        
        photoWithFrame.position.set(x, 0, z);
        photoWithFrame.rotation.y = -angle; // Face the user
        
        photoWithFrame.userData = {
          isPhoto: true,
          index: index,
          originalPosition: photoWithFrame.position.clone(),
          originalRotation: photoWithFrame.rotation.clone(),
          interactable: true
        };
        
        photoFrames.push(photoWithFrame);
        scene.add(photoWithFrame);
        
        // Add collision box for better interaction
        const collisionGeometry = new THREE.BoxGeometry(width + 0.05, height + 0.05, 0.02);
        const collisionMaterial = new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0.0, // Invisible
          side: THREE.DoubleSide
        });
        const collisionBox = new THREE.Mesh(collisionGeometry, collisionMaterial);
        photoWithFrame.add(collisionBox);
        
        // Load the actual photo texture
        textureLoader.load(
          url,
          (texture) => {
            try {
              // Calculate proper aspect ratio from loaded texture
              const imgAspectRatio = texture.image.width / texture.image.height;
              const correctedHeight = width / imgAspectRatio;
              
              // Update geometry with correct aspect ratio
              photoFrame.geometry.dispose();
              photoFrame.geometry = new THREE.PlaneGeometry(width, correctedHeight);
              borderFrame.geometry.dispose();
              borderFrame.geometry = new THREE.PlaneGeometry(width + borderWidth, correctedHeight + borderWidth);
              collisionBox.geometry.dispose();
              collisionBox.geometry = new THREE.BoxGeometry(width + 0.05, correctedHeight + 0.05, 0.02);
              
              // Update material with loaded texture
              photoFrame.material.dispose();
              photoFrame.material = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide
              });
              
              // Store reference to photo with info
              photos.push({
                mesh: photoWithFrame,
                texture: texture,
                aspectRatio: imgAspectRatio
              });
              
              updateStatus(`Photo ${index + 1}/${photoURLs.length} loaded`);
              
              if (photos.length === photoURLs.length) {
                updateStatus('All photos loaded. Use your hands to interact!');
                
                // Add simplified instructions after loading
                setTimeout(() => {
                  updateStatus('Grab a photo with one hand to move it');
                }, 3000);
                setTimeout(() => {
                  updateStatus('Grab with BOTH hands to resize/rotate');
                }, 6000);
              }
            } catch (error) {
              console.error('Error processing texture:', error);
              updateStatus(`Error processing photo ${index + 1}`);
            }
          },
          undefined,
          (error) => {
            console.error('Error loading texture:', error);
            updateStatus(`Error loading photo ${index + 1}`);
          }
        );
      });
    }

    function setupControllers(session) {
      // Set up controllers
      for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);
        controller.userData.id = i;
        controller.userData.name = i === 0 ? 'left' : 'right';
        scene.add(controller);
        
        // Add visual hand models
        addHandVisual(controller, i === 0 ? 0x6699ff : 0xff6666);
        
        // Add events
        controller.addEventListener('selectstart', onSelectStart);
        controller.addEventListener('selectend', onSelectEnd);
        
        controllers.push(controller);
      }
    }
    
    function addHandVisual(controller, color) {
      // Simple sphere to represent hand position
      const handGeometry = new THREE.SphereGeometry(0.02, 16, 16);
      const handMaterial = new THREE.MeshStandardMaterial({
        color: color,
        roughness: 0.3,
        metalness: 0.5,
        transparent: true,
        opacity: 0.7
      });
      const handMesh = new THREE.Mesh(handGeometry, handMaterial);
      controller.add(handMesh);
    }

    function onSelectStart(event) {
      const controller = event.target;
      const controllerPos = new THREE.Vector3();
      controller.getWorldPosition(controllerPos);
      
      try {
        // Add this controller to the active set
        activeControllers.add(controller.userData.id);
        
        // If we're already in transform mode or no photo is selected yet
        if (interactionMode === 'none') {
          // Try to find a photo to interact with
          const intersectedPhoto = findIntersectedPhoto(controllerPos);
          
          if (intersectedPhoto) {
            selectedPhoto = intersectedPhoto;
            interactionMode = 'move';
            highlightPhoto(selectedPhoto, true);
            
            // Store initial controller position
            initialControllerPositions[controller.userData.id] = controllerPos.clone();
            
            // Calculate offset from controller to photo center
            selectedPhoto.userData.offset = new THREE.Vector3().subVectors(
              selectedPhoto.position,
              controllerPos
            );
            
            updateStatus('Moving photo. Use both hands to resize/rotate.');
          }
        }
        // If we already have a photo selected with one hand and now the second hand grabs
        else if (interactionMode === 'move' && activeControllers.size === 2) {
          // Transition to transform mode
          interactionMode = 'transform';
          
          // Store positions of both controllers
          controllers.forEach(ctrl => {
            const pos = new THREE.Vector3();
            ctrl.getWorldPosition(pos);
            initialControllerPositions[ctrl.userData.id] = pos.clone();
          });
          
          // Calculate initial values for transform operations
          initialDistance = getControllerDistance();
          initialScale.copy(selectedPhoto.scale);
          
          // Calculate initial angle between controllers (for rotation)
          const leftPos = initialControllerPositions[0];
          const rightPos = initialControllerPositions[1];
          const vector = new THREE.Vector3().subVectors(rightPos, leftPos);
          initialRotation = Math.atan2(vector.x, vector.z);
          
          updateStatus('Resize/rotate mode active. Move hands apart to resize, twist to rotate.');
        }
      } catch (error) {
        console.error('Error in selection:', error);
        // Reset state in case of error
        resetInteraction();
      }
    }
    
    function onSelectEnd(event) {
      const controller = event.target;
      
      try {
        // Remove this controller from the active set
        activeControllers.delete(controller.userData.id);
        
        // If we're in transform mode and one hand is released
        if (interactionMode === 'transform') {
          if (activeControllers.size === 1) {
            // Go back to move mode with the remaining controller
            interactionMode = 'move';
            
            // Update the offset for the remaining controller
            const remainingControllerId = Array.from(activeControllers)[0];
            const remainingController = controllers[remainingControllerId];
            const controllerPos = new THREE.Vector3();
            remainingController.getWorldPosition(controllerPos);
            
            // Recalculate offset
            selectedPhoto.userData.offset = new THREE.Vector3().subVectors(
              selectedPhoto.position,
              controllerPos
            );
            
            updateStatus('Transform complete. Still moving photo.');
          }
          else if (activeControllers.size === 0) {
            // Complete reset - go back to no interaction
            resetInteraction();
          }
        }
        // If we're in move mode and the controller is released
        else if (interactionMode === 'move' && activeControllers.size === 0) {
          resetInteraction();
        }
      } catch (error) {
        console.error('Error in selection end:', error);
        // Reset state in case of error
        resetInteraction();
      }
    }
    
    function resetInteraction() {
      if (selectedPhoto) {
        highlightPhoto(selectedPhoto, false);
      }
      
      selectedPhoto = null;
      interactionMode = 'none';
      activeControllers.clear();
      initialControllerPositions = {};
      updateStatus('Photo placed. Select again to move.');
    }
    
    function highlightPhoto(photo, isHighlighted) {
      // Apply visual feedback to the border frame (second child)
      if (photo.children && photo.children.length > 1) {
        const borderFrame = photo.children[1];
        if (borderFrame.material) {
          if (isHighlighted) {
            borderFrame.material.color.set(0x0066ff);
            borderFrame.material.emissive = new THREE.Color(0x0066ff);
            borderFrame.material.emissiveIntensity = 0.5;
          } else {
            borderFrame.material.color.set(0xffffff);
            borderFrame.material.emissiveIntensity = 0;
          }
        }
      }
    }
    
    function getControllerDistance() {
      // Calculate distance between controllers
      if (controllers.length < 2) return 0;
      
      const leftPos = new THREE.Vector3();
      const rightPos = new THREE.Vector3();
      
      controllers[0].getWorldPosition(leftPos);
      controllers[1].getWorldPosition(rightPos);
      
      return leftPos.distanceTo(rightPos);
    }
    
    function findIntersectedPhoto(controllerPos) {
      // Simple proximity check for photos
      let closestPhoto = null;
      let closestDistance = 0.15; // Max interaction distance
      
      photoFrames.forEach(photoFrame => {
        const distance = controllerPos.distanceTo(photoFrame.position);
        
        if (distance < closestDistance) {
          closestDistance = distance;
          closestPhoto = photoFrame;
        }
      });
      
      return closestPhoto;
    }

    function handlePhotoInteraction() {
      if (!selectedPhoto) return;
      
      try {
        // Handle move interaction with a single controller
        if (interactionMode === 'move' && activeControllers.size === 1) {
          const controllerId = Array.from(activeControllers)[0];
          const controller = controllers[controllerId];
          
          const controllerPos = new THREE.Vector3();
          controller.getWorldPosition(controllerPos);
          
          // Update position based on controller movement with the saved offset
          if (selectedPhoto.userData.offset) {
            selectedPhoto.position.copy(controllerPos).add(selectedPhoto.userData.offset);
          }
        }
        
        // Handle transform (resize & rotate) with two controllers
        else if (interactionMode === 'transform' && activeControllers.size === 2) {
          // Get current controller positions
          const currentPositions = [];
          controllers.forEach(controller => {
            const pos = new THREE.Vector3();
            controller.getWorldPosition(pos);
            currentPositions[controller.userData.id] = pos;
          });
          
          // Calculate current distance for scaling
          const currentDistance = getControllerDistance();
          
          // Scale photo based on change in distance
          if (initialDistance > 0) {
            let scaleFactor = currentDistance / initialDistance;
            
            // Limit scale factor to reasonable ranges
            scaleFactor = Math.max(0.5, Math.min(scaleFactor, 2.5));
            
            selectedPhoto.scale.copy(initialScale).multiplyScalar(scaleFactor);
          }
          
          // Handle rotation - calculate angle between controllers
          const leftPos = currentPositions[0];
          const rightPos = currentPositions[1];
          
          if (leftPos && rightPos) {
            const vector = new THREE.Vector3().subVectors(rightPos, leftPos);
            const currentAngle = Math.atan2(vector.x, vector.z);
            
            // Calculate rotation delta from initial angle
            const rotationDelta = currentAngle - initialRotation;
            
            // Rotate around Y-axis (vertical)
            selectedPhoto.rotation.y = selectedPhoto.userData.originalRotation.y + rotationDelta;
          }
          
          // Position photo at the midpoint between controllers
          if (leftPos && rightPos) {
            const midpoint = new THREE.Vector3().addVectors(leftPos, rightPos).multiplyScalar(0.5);
            
            // Apply an offset from the midpoint to place photo in front of the user
            const forward = new THREE.Vector3(0, 0, -0.05);
            forward.applyQuaternion(camera.quaternion);
            
            midpoint.add(forward);
            selectedPhoto.position.copy(midpoint);
          }
        }
      } catch (error) {
        console.error('Error in photo interaction:', error);
        // Reset state in case of error
        resetInteraction();
      }
    }

    function render(timestamp, frame) {
      if (frame) {
        try {
          // Handle photo interactions
          if (selectedPhoto) {
            handlePhotoInteraction();
          }
        } catch (error) {
          console.error('Error in render loop:', error);
          // Reset state in case of error
          resetInteraction();
        }
      }
      
      // Always render, even if there was an error in the logic
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
